services:
  app:
    build: .
    image: load-balancer-sandbox:local
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_DEMO_AUTOSTARTTRAFFIC: ${APP_DEMO_AUTOSTARTTRAFFIC:-true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/backends"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
